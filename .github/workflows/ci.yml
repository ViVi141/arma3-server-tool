name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-test:
    # 固定到 Ubuntu 24.04 LTS：ubuntu-latest 已升级为 26.04，
    # Playwright 1.60 尚不支持该系统版本（install --with-deps 会失败）
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Build Service
        run: npm run build:service

      - name: Build Web
        run: npm run build:web

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: packages/web

      - name: E2E Web
        run: |
          mkdir -p .a3st-e2e-data
          rm -rf .a3st-e2e-data
          mkdir -p .a3st-e2e-data
          DATA_DIR=$GITHUB_WORKSPACE/.a3st-e2e-data PORT=19580 HOST=127.0.0.1 node packages/service/dist/index.js &
          SERVICE_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19580/api/v1/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:19580/api/v1/health
          cd packages/web && npx playwright test
          kill $SERVICE_PID || true
