name: CI

on:
  push:
    branches:
      - main
      - master
      - 'auto-fix/**'
  pull_request:
    branches:
      - main
      - master
      - 'auto-fix/**'

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Arma3ServerTools.sln

      - name: Build
        run: dotnet build Arma3ServerTools.sln -c Release --no-restore

      - name: Build Agent (standalone)
        run: dotnet build src/Arma3ServerTools.Agent.Host/ -c Release --no-restore

      - name: Test Core
        run: dotnet test tests/Arma3ServerTools.Core.Tests/Arma3ServerTools.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Test Application
        run: dotnet test tests/Arma3ServerTools.Application.Tests/Arma3ServerTools.Application.Tests.csproj -c Release --no-build --verbosity normal

      - name: Verify formatting
        run: dotnet format Arma3ServerTools.sln --verify-no-changes --no-restore --verbosity diagnostic
